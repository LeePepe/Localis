name: CI

# Two triggers:
#   - pull_request → main: gate PRs BEFORE merge. Set `spm` and `policy` as
#     required status checks in branch protection so a red run blocks the merge.
#   - push → main: post-merge safety net.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Job A: the SPM packages — swift build + test, seconds, no simulator ----
  # This is the primary gate. Layer logic lives in the packages, so this job
  # covers most of the codebase and runs in seconds.
  spm:
    name: SPM ${{ matrix.package }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package:
          - LocalisModels
          - TransportKit
          - ChatService
          - SkillsKit
          - SessionStore
          - LocalisUI
          - DesignKit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: swift build
        working-directory: Packages/${{ matrix.package }}
        run: swift build
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  # ---- Job B: the app target — xcodegen + xcodebuild test on a simulator ----
  app:
    name: App target
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Install XcodeGen
        run: brew install xcodegen
      # The .xcodeproj is generated, never committed — CI regenerates it from
      # project.yml, so a stale checked-in pbxproj can never drift into a build.
      - name: Generate project
        run: xcodegen generate
      # Resolve a UDID rather than naming a device. `name=iPhone 17` matches
      # whatever the runner image happens to ship, and when it matches nothing
      # xcodebuild fails with "Unable to find a device matching the provided
      # destination specifier" — a red indistinguishable from a broken change,
      # which has already cost one investigation. Device names move with Xcode
      # releases; a UDID read off the machine cannot be stale. (This machine,
      # for instance, has no iPhone 17 at all — only 16s.)
      - name: Resolve a simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available \
            | awk '/-- iOS/{ios=1; next} /^-- /{ios=0}
                   ios && /iPhone/ && /\(Booted\)|\(Shutdown\)/ {
                     if (match($0, /\([0-9A-F-]{36}\)/)) {
                       print substr($0, RSTART+1, RLENGTH-2); exit } }')
          # Fail loudly rather than falling back. "No simulator available" and
          # "ran on some other device" must not look alike — the second goes
          # green on hardware nobody chose.
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl list devices available | grep -F "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Localis.xcodeproj \
            -scheme Localis \
            -destination "id=$SIMULATOR_UDID" \
            -skipPackagePluginValidation \
            2>&1 | tee /tmp/xcb.log | tail -60
      - name: Surface compile/test errors
        if: failure()
        run: grep -E "error:|Testing failed|BUILD FAILED|Unable to find" /tmp/xcb.log | sort -u | head -60 || true

  # ---- Job C: lint + policy gates (mirrors the local hooks, server-side) ----
  policy:
    name: Lint & policy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Secret scan: Localis stores user-supplied agent endpoints and tokens,
      # so a hardcoded credential is a real risk surface, not a hypothetical.
      - name: Install gitleaks
        run: brew install gitleaks
      - name: gitleaks detect (full history)
        run: gitleaks detect --no-banner --redact
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint --strict
        run: swiftlint lint --strict
      # Layer frontmatter must stay consistent with the packages on disk.
      #
      # The self-test runs first for the same reason the wiring one does. This
      # check's job is to turn a missing tech-context.md into an error — before
      # it named its layers, a package without one was skipped by the glob and
      # the run went green. A coverage check that lost the ability to fail would
      # bring that silence back while still printing ✅.
      - name: Frontmatter check can still fail
        run: bash scripts/check-frontmatter.sh --self-test
      - name: Layer frontmatter anti-rot check
        run: bash scripts/check-frontmatter.sh
      # The self-test runs first and is not redundant: a wiring check that has
      # quietly become incapable of failing is worse than no check at all,
      # because its green tells the next person the assembly is sound. It
      # covers all four ways this check has been fed a false answer — never
      # imported, imported-but-unused, named only in a comment, and reporting
      # a problem unconditionally.
      - name: Wiring check can still fail
        run: bash scripts/check-wiring.sh --self-test
      # RED ON PURPOSE until the assembly layer lands (#16). `project.yml`
      # declares SkillsKit under the app target and nothing imports it, and
      # TransportKit is imported without a single one of its types being used.
      #
      # `continue-on-error` because this reports a known, tracked gap rather
      # than a regression introduced by the commit under test — blocking every
      # PR on it would train people to ignore the job. It goes to `false` in
      # the same commit that makes the check green, and the self-test above
      # stays blocking meanwhile so the check cannot rot unnoticed.
      - name: App target imports what it declares
        continue-on-error: true
        run: bash scripts/check-wiring.sh
